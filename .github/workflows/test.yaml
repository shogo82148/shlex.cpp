name: test
on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - run: g++ --version
      - name: run test
        run: make test

  macos:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - run: g++ --version
      - name: run test
        run: make test

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: run test
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VS_PATH=%%i
          call "%VS_PATH%\VC\Auxiliary\Build\vcvarsall.bat" x64 || exit /b 1
          nmake -f Makefile.msvc test
